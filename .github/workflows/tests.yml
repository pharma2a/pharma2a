name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - run: python -m pytest -q
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.14.3
      - run: ruff check .
  installation:
    # une installation sans -e, comme « pip install git+https://... » : le dictionnaire suit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: |
          cd "$RUNNER_TEMP"
          python -I -c "import json, pharma2a.serveur; from pharma2a.dictionnaire import SCHEMAS, valider; assert valider('commande', json.loads((SCHEMAS / 'exemples' / 'commande.json').read_text())) == []"
